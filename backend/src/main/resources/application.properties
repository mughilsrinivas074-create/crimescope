# CrimeScope AI - Application Properties
spring.application.name=crimescope-backend
server.port=${PORT:8080}

# Environment-based Datasource Configuration (Default: H2 in MySQL compatibility mode for instant execution, switches seamlessly via env vars to MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:crimescopedb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Security & JWT Token Configuration
security.jwt.secret=${JWT_SECRET:Cr1m3Sc0p3A1T4m1lN4duCr1m3Int3ll1g3nc3C0mm4ndC3nt3rS3cur3K3y2026!}
security.jwt.expiration-ms=86400000

# AI Configuration (Gemini API)
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.gemini.api-url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models}
ai.gemini.timeout-seconds=25

# Mapillary Geospatial Imagery Configuration
mapillary.client-token=${MAPILLARY_CLIENT_TOKEN:}
mapillary.api-url=${MAPILLARY_API_URL:https://graph.mapillary.com}
mapillary.timeout-seconds=15

# CARTO Basemap Configuration
carto.api-key=${CARTO_API_KEY:}

# File Handling & Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator Telemetry & Health Check
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.crimescope=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
